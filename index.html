<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Bot</title>
    <style>
        body {
            background-color: #0c0d10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: et;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16181d;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .card {
            background: #16181d;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid #23262f;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #1f2229;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .stat-box {
            text-align: center;
        }
        .stat-box span {
            display: block;
            font-size: 11px;
            color: #8b91a0;
        }
        .stat-box strong {
            font-size: 14px;
            color: #f3ba2f;
        }
        .btn-mine {
            background: linear-gradient(135deg, #f3ba2f, #e89e00);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #16181d;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            border-top: 1px solid #23262f;
        }
        .nav-item {
            text-align: center;
            color: #8b91a0;
            font-size: 12px;
        }
        .nav-item.active {
            color: #f3ba2f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>👑 Level 1</div>
        <div style="color: #f3ba2f; font-weight: bold;">🪙 <span id="gold">80.728</span></div>
    </div>

    <div class="card">
        <h3>PIRATE LV. 1</h3>
        <div class="stats">
            <div class="stat-box">
                <span>HOURLY</span>
                <strong>0.713</strong>
            </div>
            <div class="stat-box">
                <span>DAILY</span>
                <strong>17.115</strong>
            </div>
            <div class="stat-box">
                <span>MONTHLY</span>
                <strong>513.450</strong>
            </div>
        </div>
        <div style="margin: 10px 0; color: #8b91a0; font-size: 13px;">الوقت الباقي للتعدين: <span id="timer" style="color:#fff;">11:59:56</span></div>
        <button class="btn-mine" onclick="startMining()">⛏️ MINING ACTIVE</button>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active">⚓ التعدين</div>
    <div class="nav-item">🪙 المهام</div>
    <div class="nav-item">👥 الأصدقاء</div>
    <div class="nav-item">💼 المحفظة</div>
</div>

<script>
    function startMining() {
        alert("تم تفعيل التعدين بنجاح! ستبدأ الأرباح بالتزايد.");
    }
</script>

</body>
</html>
