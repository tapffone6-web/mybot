<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التعدين - Telegram Mini App</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; color: #38bdf8; }
        .coin-count {
            font-size: 36px;
            font-weight: bold;
            color: #facc15;
            margin: 20px 0;
        }
        .mine-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛏️ منصة التعدين</h1>
        <p>اضغط على الزر أسفله لجمع العملات:</p>
        <div class="coin-count" id="score">0</div>
        <button class="mine-btn" onclick="mineCoin()">اضغط للتعدين 🪙</button>
    </div>
    <script>
        let score = 0;
        function mineCoin() {
            score += 1;
            document.getElementById('score').innerText = score;
        }
    </script>
</body>
</html>
